site_name: My Documentations

theme:
  name: mkdocs
  color_mode: auto
  user_color_mode_toggle: true
  locale: en
  highlightjs: true
  hljs_languages:
    - yaml
    - django
  shortcuts:
    help: 191    # ?
    next: 78     # n
    previous: 80 # p
    search: 83   # s

#plugins:
#  - search

#extra_css:
#  - extra/custom.css

#extra_javascript:
#  - extra/shortcut.js

markdown_extensions:
  - toc:
      permalink: 
