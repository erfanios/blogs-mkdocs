site_name: My Documentations

theme:
  name: mkdocs
  color_mode: auto
  user_color_mode_toggle: true
  locale: en
  highlightjs: true
  hljs_languages:
    - yaml
    - django
    - bash
  shortcuts:
    help: 191    # ?
    next: 78     # n
    previous: 80 # p
    search: 83   # s

#plugins:
#  - search

#extra_css:
#  - extra/custom.css

#extra_javascript:
#  - extra/shortcut.js

markdown_extensions:
  - toc:
      permalink: 
#      baselevel: "3"
#      toc_depth: "3"
#      toc_depth: 2-3
  - pymdownx.arithmatex:
        generic: true
  - pymdownx.betterem
    
extra_javascript:
  - https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js
  - javascripts/katex.js
extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css
