site_name: My Documentations
theme:
  name: mkdocs
  palette:
    scheme: default
    primary: white
    accent: grey
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.tracking 
#    - toc.integrate 
    - search.suggest
    - search.highlight
markdown_extensions:
  - toc:
      baselevel: "3"
      toc_depth: "3"
